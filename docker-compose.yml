services:
  api-livres:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-livres:1.0.0
    container_name: api-livres-node
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo-livres:27017/livresdb
    depends_on:
      - mongo-livres
    networks:
      - livres-network
    restart: unless-stopped

  mongo-livres:
    image: mongo:8.0
    container_name: api-livres-mongo
    ports:
      - "27017:27017"
    volumes:
      - livres-mongo-data:/data/db
    networks:
      - livres-network
    restart: unless-stopped

networks:
  livres-network:
    name: api-livres-network
    driver: bridge

volumes:
  livres-mongo-data:
    name: api-livres-mongo-data
